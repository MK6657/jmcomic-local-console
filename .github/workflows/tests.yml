# Offline regression suite. Runs on Windows because the app uses Windows APIs
# (named mutex, CREATE_NO_WINDOW, junctions). No network access is needed by the
# tests themselves: tests/conftest.py blocks sockets and libcurl.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline tests (Windows, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        # bash runs with -e -o pipefail, so any failing command fails the step
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py launcher.py core routes

      - name: Run offline test suite
        run: python -m pytest -q -rs

      - name: Check JavaScript syntax
        run: |
          node --version
          status=0
          for file in static/js/*.js; do
            if ! node --check "$file"; then
              echo "::error file=$file::node --check failed"
              status=1
            fi
          done
          exit $status
