<div id="search-history-container" class="mb-3" data-session="{{ search_history_session }}">
    <button type="button" id="search-history-toggle" class="btn btn-sm btn-outline-secondary"
            aria-controls="search-history-panel" aria-expanded="false">
        <i class="bi bi-eye" aria-hidden="true"></i> 搜索历史
    </button>
    <div id="search-history-panel" class="mt-2" hidden>
        <div id="search-history-status" class="small text-muted" role="status"></div>
        <div id="search-history-tags" class="d-flex flex-wrap gap-2"></div>
    </div>
</div>
