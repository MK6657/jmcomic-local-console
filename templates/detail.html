{% extends "base.html" %}
{% block title %}{{ album_id }} - JMComic 下载控制台{% endblock %}

{% block content %}

<!-- 封面与信息卡片在 JS 渲染的 .row 内并排、顶端对齐；章节列表在下方占满整行 -->
<div class="pt-3" id="album-detail-container">
    <!-- 加载中 -->
    <div class="text-center py-5" id="loading-spinner">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">加载中...</span>
        </div>
        <p class="mt-2 text-muted">正在获取漫画详情...</p>
    </div>

    <!-- 错误提示 -->
    <div id="error-message" class="alert alert-danger d-none"></div>

    <!-- 动态渲染的内容 -->
    <div id="album-content" class="d-none">
        <!-- 由 JS 填充 -->
    </div>
</div>

{% endblock %}

{% block scripts_extra %}
<script>var albumId = {{ album_id|tojson }};</script>
<script src="{{ asset_url('js/utils.js') }}"></script>
<script src="{{ asset_url('js/detail.js') }}"></script>
{% endblock %}
