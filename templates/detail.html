{% extends "base.html" %}
{% block title %}JM {{ album_id }} · 藏书阁书目{% endblock %}
{% block head_extra %}<link rel="stylesheet" href="{{ asset_url('css/atelier-downloads.css') }}">{% endblock %}

{% block content %}

<div class="album-monograph" id="album-detail-container">
    <div class="monograph-running-head"><span class="folio-kicker">藏书阁 / 馆藏书目</span><span>JM {{ album_id }}</span></div>
    <p class="folio-empty" id="loading-spinner" role="status">正在读取书目与章节…</p>
    <div id="error-message" class="folio-notice d-none" role="alert"></div>
    <div id="album-content" class="d-none"></div>
</div>

{% endblock %}

{% block scripts_extra %}
<script>var albumId = {{ album_id|tojson }};</script>
<script src="{{ asset_url('js/utils.js') }}"></script>
<script src="{{ asset_url('js/reading-nav.js') }}"></script>
<script src="{{ asset_url('js/detail.js') }}"></script>
{% endblock %}
