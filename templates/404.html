{% extends "base.html" %}
{% block title %}页面未找到 · 藏书阁{% endblock %}

{% block content %}
<section class="atelier-error" aria-labelledby="error-title">
    <p class="err-code">404 / 未收录</p>
    <h1 id="error-title">页面未找到</h1>
    <p>你访问的页面不存在。请检查地址，或返回书斋重新查找。</p>
    <div class="err-actions">
        <a href="/" class="btn btn-primary">
            <i class="bi bi-house-door"></i> 返回首页
        </a>
        <button type="button" id="error-back-btn" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> 返回上一页
        </button>
    </div>
</section>
<script>
(function () {
  var btn = document.getElementById('error-back-btn');
  if (btn) btn.addEventListener('click', function () {
    if (window.history.length > 1) window.history.back();
    else window.location.href = '/';
  });
})();
</script>
{% endblock %}
