{% extends "base.html" %}
{% block title %}服务器错误 · 藏书阁{% endblock %}

{% block content %}
<section class="atelier-error" aria-labelledby="error-title">
    <p class="err-code">500 / 服务异常</p>
    <h1 id="error-title">服务器内部错误</h1>
    <p>服务遇到了问题，请稍后重试。如果问题持续，可以在<a href="/settings#logs">日志与诊断</a>中查看记录。</p>
    <div class="err-actions">
        <a href="/" class="btn btn-primary">
            <i class="bi bi-house-door"></i> 返回首页
        </a>
        <a href="/downloads" class="btn btn-outline-secondary">
            <i class="bi bi-list-ul"></i> 查看下载管理
        </a>
    </div>
</section>
{% endblock %}
