{% extends "base.html" %}
{% block title %}JMComic 下载控制台 - 下载管理{% endblock %}

{% block content %}

<h4 class="mb-4"><i class="bi bi-list-ul"></i> 下载管理</h4>

<!-- ===== 选项卡导航 ===== -->
<ul class="nav nav-tabs mb-4" id="downloadTabs" role="tablist">
    <li class="nav-item" role="presentation">
        <button class="nav-link active" id="running-tab"
                data-bs-toggle="tab" data-bs-target="#running"
                type="button" role="tab" aria-controls="running" aria-selected="true">
            <i class="bi bi-arrow-repeat"></i> 进行中
            <span id="running-count" class="badge bg-primary ms-1">0</span>
        </button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="queued-tab"
                data-bs-toggle="tab" data-bs-target="#queued"
                type="button" role="tab" aria-controls="queued" aria-selected="false">
            <i class="bi bi-clock"></i> 排队中
            <span id="queued-count" class="badge bg-secondary ms-1">0</span>
        </button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="completed-tab"
                data-bs-toggle="tab" data-bs-target="#completed"
                type="button" role="tab" aria-controls="completed" aria-selected="false">
            <i class="bi bi-check-circle"></i> 已完成
            <span id="completed-count" class="badge bg-success ms-1">0</span>
        </button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="failed-tab"
                data-bs-toggle="tab" data-bs-target="#failed"
                type="button" role="tab" aria-controls="failed" aria-selected="false">
            <i class="bi bi-exclamation-triangle"></i> 失败
            <span id="failed-count" class="badge bg-danger ms-1">0</span>
        </button>
    </li>
</ul>

<!-- ===== 选项卡内容 ===== -->
<div class="tab-content" id="downloadTabsContent">

    <!-- 进行中 -->
    <div class="tab-pane fade show active" id="running" role="tabpanel" aria-labelledby="running-tab">
        <div id="running-section">
            <div class="text-center text-muted py-4">
                <i class="bi bi-emoji-neutral" style="font-size: 2rem;"></i>
                <p class="mt-2 mb-0">加载中...</p>
            </div>
        </div>
    </div>

    <!-- 排队中 -->
    <div class="tab-pane fade" id="queued" role="tabpanel" aria-labelledby="queued-tab">
        <div id="queued-section">
            <div class="text-center text-muted py-4">
                <i class="bi bi-emoji-neutral" style="font-size: 2rem;"></i>
                <p class="mt-2 mb-0">加载中...</p>
            </div>
        </div>
    </div>

    <!-- 已完成 -->
    <div class="tab-pane fade" id="completed" role="tabpanel" aria-labelledby="completed-tab">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="fw-semibold text-success"><i class="bi bi-check-circle"></i> 已完成</span>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-outline-warning" onclick="batchRetryFailed()"
                        title="重试所有失败任务">
                    <i class="bi bi-arrow-counterclockwise"></i> 批量重试
                </button>
                <button class="btn btn-sm btn-outline-warning" onclick="clearJobs('canceled')"
                        title="只删除记录，不删除文件">
                    <i class="bi bi-trash"></i> 清空已取消
                </button>
                <button class="btn btn-sm btn-outline-success" onclick="clearJobs('completed')"
                        title="只删除记录，不删除文件">
                    <i class="bi bi-trash"></i> 清空已完成
                </button>
                <button class="btn btn-sm btn-outline-secondary" onclick="clearFinished()"
                        title="只删除记录，不删除文件">
                    <i class="bi bi-trash-fill"></i> 清空全部已完成记录
                </button>
            </div>
        </div>
        <div id="completed-section">
            <div class="text-center text-muted py-4">
                <i class="bi bi-emoji-neutral" style="font-size: 2rem;"></i>
                <p class="mt-2 mb-0">加载中...</p>
            </div>
        </div>
    </div>

    <!-- 失败 -->
    <div class="tab-pane fade" id="failed" role="tabpanel" aria-labelledby="failed-tab">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="fw-semibold text-danger"><i class="bi bi-exclamation-triangle"></i> 失败</span>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-outline-warning" onclick="batchRetryFailed()"
                        title="重试所有失败任务">
                    <i class="bi bi-arrow-counterclockwise"></i> 批量重试
                </button>
                <button class="btn btn-sm btn-outline-danger" onclick="clearJobs('failed')"
                        title="只删除记录，不删除文件">
                    <i class="bi bi-trash"></i> 清空失败
                </button>
            </div>
        </div>
        <div id="failed-section">
            <div class="text-center text-muted py-4">
                <i class="bi bi-emoji-neutral" style="font-size: 2rem;"></i>
                <p class="mt-2 mb-0">加载中...</p>
            </div>
        </div>
    </div>

</div>

{% endblock %}

{% block scripts_extra %}
<script src="{{ asset_url('js/utils.js') }}"></script>
<script src="{{ asset_url('js/sse-client.js') }}"></script>
<script src="{{ asset_url('js/downloads.js') }}"></script>
{% endblock %}
