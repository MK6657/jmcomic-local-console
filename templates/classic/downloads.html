{% extends "classic/base.html" %}
{% block title %}JMComic 下载控制台 - 下载管理{% endblock %}

{% block content %}

<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
    <h4 class="mb-0"><i class="bi bi-list-ul"></i> 下载管理</h4>
    <button type="button" class="btn btn-sm btn-outline-secondary" id="downloads-open-export-btn"
            title="打开本地「导出」文件夹">
        <i class="bi bi-folder2-open" aria-hidden="true"></i> 导出文件夹
    </button>
</div>

<!-- ===== 选项卡导航 ===== -->
<ul class="nav nav-tabs mb-4" id="downloadTabs" role="tablist">
    <li class="nav-item" role="presentation">
        <button class="nav-link active" id="running-tab"
                data-bs-toggle="tab" data-bs-target="#running"
                type="button" role="tab" aria-controls="running" aria-selected="true">
            <i class="bi bi-arrow-repeat"></i> 进行中
            <span id="running-count" class="badge bg-primary ms-1">0</span>
        </button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="queued-tab"
                data-bs-toggle="tab" data-bs-target="#queued"
                type="button" role="tab" aria-controls="queued" aria-selected="false">
            <i class="bi bi-clock"></i> 排队中
            <span id="queued-count" class="badge bg-secondary ms-1">0</span>
        </button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="completed-tab"
                data-bs-toggle="tab" data-bs-target="#completed"
                type="button" role="tab" aria-controls="completed" aria-selected="false">
            <i class="bi bi-check-circle"></i> 已完成
            <span id="completed-count" class="badge bg-success ms-1">0</span>
        </button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="failed-tab"
                data-bs-toggle="tab" data-bs-target="#failed"
                type="button" role="tab" aria-controls="failed" aria-selected="false">
            <i class="bi bi-exclamation-triangle"></i> 失败
            <span id="failed-count" class="badge bg-danger ms-1">0</span>
        </button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="canceled-tab"
                data-bs-toggle="tab" data-bs-target="#canceled"
                type="button" role="tab" aria-controls="canceled" aria-selected="false">
            <i class="bi bi-slash-circle"></i> 已取消
            <span id="canceled-count" class="badge bg-secondary ms-1">0</span>
        </button>
    </li>
</ul>

<!-- ===== 选项卡内容 ===== -->
<div class="tab-content" id="downloadTabsContent">

    <!-- 进行中 -->
    <div class="tab-pane fade show active" id="running" role="tabpanel" aria-labelledby="running-tab">
        <div id="running-section">
            <div class="text-center text-muted py-4">
                <i class="bi bi-emoji-neutral" style="font-size: 2rem;"></i>
                <p class="mt-2 mb-0">加载中...</p>
            </div>
        </div>
        <div id="running-pagination" class="pagination-container"></div>
    </div>

    <!-- 排队中 -->
    <div class="tab-pane fade" id="queued" role="tabpanel" aria-labelledby="queued-tab">
        <div id="queued-section">
            <div class="text-center text-muted py-4">
                <i class="bi bi-emoji-neutral" style="font-size: 2rem;"></i>
                <p class="mt-2 mb-0">加载中...</p>
            </div>
        </div>
        <div id="queued-pagination" class="pagination-container"></div>
    </div>

    <!-- 已完成 -->
    <div class="tab-pane fade" id="completed" role="tabpanel" aria-labelledby="completed-tab">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <span class="fw-semibold text-success"><i class="bi bi-check-circle"></i> 已完成</span>
            <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-sm btn-outline-success" data-action="clear" data-status="completed"
                        title="只删除记录，不删除文件">
                    <i class="bi bi-trash"></i> 清空已完成
                </button>
                <button type="button" class="btn btn-sm btn-outline-secondary" data-action="clear-finished"
                        title="清空已完成、失败和已取消的全部任务记录，不删除文件">
                    <i class="bi bi-trash-fill"></i> 清空所有已结束记录
                </button>
            </div>
        </div>
        <div id="completed-section">
            <div class="text-center text-muted py-4">
                <i class="bi bi-emoji-neutral" style="font-size: 2rem;"></i>
                <p class="mt-2 mb-0">加载中...</p>
            </div>
        </div>
        <div id="completed-pagination" class="pagination-container"></div>
    </div>

    <!-- 失败 -->
    <div class="tab-pane fade" id="failed" role="tabpanel" aria-labelledby="failed-tab">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <span class="fw-semibold text-danger"><i class="bi bi-exclamation-triangle"></i> 失败</span>
            <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-sm btn-outline-warning" data-action="batch-retry"
                        title="只重试当前页显示的失败任务">
                    <i class="bi bi-arrow-counterclockwise"></i> 重试本页
                </button>
                <button type="button" class="btn btn-sm btn-outline-danger" data-action="clear" data-status="failed"
                        title="只删除记录，不删除文件">
                    <i class="bi bi-trash"></i> 清空失败
                </button>
            </div>
        </div>
        <div id="failed-section">
            <div class="text-center text-muted py-4">
                <i class="bi bi-emoji-neutral" style="font-size: 2rem;"></i>
                <p class="mt-2 mb-0">加载中...</p>
            </div>
        </div>
        <div id="failed-pagination" class="pagination-container"></div>
    </div>

    <!-- 已取消 -->
    <div class="tab-pane fade" id="canceled" role="tabpanel" aria-labelledby="canceled-tab">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <span class="fw-semibold text-secondary"><i class="bi bi-slash-circle"></i> 已取消</span>
            <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-sm btn-outline-secondary" data-action="clear" data-status="canceled"
                        title="只删除记录，不删除文件">
                    <i class="bi bi-trash"></i> 清空已取消
                </button>
            </div>
        </div>
        <div id="canceled-section">
            <div class="text-center text-muted py-4">
                <i class="bi bi-emoji-neutral" style="font-size: 2rem;"></i>
                <p class="mt-2 mb-0">加载中...</p>
            </div>
        </div>
        <div id="canceled-pagination" class="pagination-container"></div>
    </div>

</div>

{% endblock %}

{% block scripts_extra %}
<script src="{{ asset_url('js/utils.js') }}"></script>
<script src="{{ asset_url('js/export.js') }}"></script>
<script src="{{ asset_url('js/sse-client.js') }}"></script>
<script src="{{ asset_url('js/downloads.js') }}"></script>
{% endblock %}
