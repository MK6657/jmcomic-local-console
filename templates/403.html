{% extends "base.html" %}
{% block title %}拒绝访问 · 藏书阁{% endblock %}

{% block content %}
<section class="atelier-error" aria-labelledby="error-title">
    <p class="err-code">403 / 访问受限</p>
    <h1 id="error-title">拒绝访问</h1>
    <p>你没有权限访问该资源。可以返回书斋，或检索其他书目。</p>
    <div class="err-actions">
        <a href="/" class="btn btn-primary">
            <i class="bi bi-house-door"></i> 返回首页
        </a>
        <a href="/search" data-nav-memory="/search" class="btn btn-outline-secondary">
            <i class="bi bi-search"></i> 去搜索
        </a>
    </div>
</section>
{% endblock %}
